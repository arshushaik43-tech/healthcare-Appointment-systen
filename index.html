<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HospitalCare | Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="loginPage" class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="brand-mark" aria-hidden="true">+</div>
      <p class="eyebrow"></p>
      <h1 id="loginTitle"></h1>
      <p class="muted">.</p>
      <form id="loginForm" class="stacked-form">
        <label for="email"></label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="submit" class="primary-button">Login</button>
        <p id="loginMessage" class="form-message" role="alert"></p>
      </form>
      <p class="demo-note">.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
